# add-on

addon.xsense.name = X-Sense Binding
addon.xsense.description = Integrates X-Sense smoke, carbon monoxide, heat and water leak detectors and thermo-hygrometers connected through an X-Sense base station (e.g. SBS50) using the X-Sense cloud.

# add-on config

addon.config.xsense.refreshInterval.label = Default Refresh Interval
addon.config.xsense.refreshInterval.description = Default interval in seconds for polling the device inventory from the X-Sense cloud. Used by all accounts that do not configure an own interval.

# thing types

thing-type.xsense.account.label = X-Sense Account
thing-type.xsense.account.description = Connects to the X-Sense cloud account and provides access to the registered base stations and sensors.
thing-type.xsense.co.label = X-Sense CO Detector
thing-type.xsense.co.description = X-Sense carbon monoxide detector (e.g. XC01-M).
thing-type.xsense.heat.label = X-Sense Heat Detector
thing-type.xsense.heat.description = X-Sense heat detector (e.g. XH02-M).
thing-type.xsense.home.label = X-Sense Home
thing-type.xsense.home.description = A home (house) registered in the X-Sense account, grouping its base stations and sensors.
thing-type.xsense.smoke.label = X-Sense Smoke Detector
thing-type.xsense.smoke.description = X-Sense smoke detector (e.g. XS01-M).
thing-type.xsense.smokeco.label = X-Sense Smoke/CO Detector
thing-type.xsense.smokeco.description = X-Sense combined smoke and carbon monoxide detector (e.g. SC07-MR, XP0A-MR).
thing-type.xsense.station.label = X-Sense Base Station
thing-type.xsense.station.description = X-Sense base station (e.g. SBS50) connecting the battery powered sensors to the X-Sense cloud.
thing-type.xsense.thermohygro.label = X-Sense Thermo-Hygrometer
thing-type.xsense.thermohygro.description = X-Sense temperature and humidity sensor (e.g. STH51).
thing-type.xsense.water.label = X-Sense Water Leak Detector
thing-type.xsense.water.description = X-Sense water leak detector (e.g. SWS51).

# thing types config

thing-type.config.xsense.account.email.label = Email Address
thing-type.config.xsense.account.email.description = Email address of the X-Sense account.
thing-type.config.xsense.account.password.label = Password
thing-type.config.xsense.account.password.description = Password of the X-Sense account.
thing-type.config.xsense.account.refreshInterval.label = Refresh Interval
thing-type.config.xsense.account.refreshInterval.description = Interval in seconds for polling the device inventory from the X-Sense cloud. If not set, the default from the binding configuration applies.
thing-type.config.xsense.co.deviceSn.label = Serial Number
thing-type.config.xsense.co.deviceSn.description = Serial number of the sensor.
thing-type.config.xsense.heat.deviceSn.label = Serial Number
thing-type.config.xsense.heat.deviceSn.description = Serial number of the sensor.
thing-type.config.xsense.home.houseId.label = House ID
thing-type.config.xsense.home.houseId.description = Identifier of the home in the X-Sense cloud.
thing-type.config.xsense.smoke.deviceSn.label = Serial Number
thing-type.config.xsense.smoke.deviceSn.description = Serial number of the sensor.
thing-type.config.xsense.smokeco.deviceSn.label = Serial Number
thing-type.config.xsense.smokeco.deviceSn.description = Serial number of the sensor.
thing-type.config.xsense.station.stationSn.label = Serial Number
thing-type.config.xsense.station.stationSn.description = Serial number of the base station.
thing-type.config.xsense.thermohygro.deviceSn.label = Serial Number
thing-type.config.xsense.thermohygro.deviceSn.description = Serial number of the sensor.
thing-type.config.xsense.water.deviceSn.label = Serial Number
thing-type.config.xsense.water.deviceSn.description = Serial number of the sensor.

