# add-on

addon.xsense.name = X-Sense Binding
addon.xsense.description = Integrates X-Sense smoke, carbon monoxide, heat and water leak detectors and thermo-hygrometers connected through an X-Sense base station (e.g. SBS50) using the X-Sense cloud.

# add-on config

addon.config.xsense.refreshInterval.label = Default Refresh Interval
addon.config.xsense.refreshInterval.description = Default interval in seconds for polling the device inventory from the X-Sense cloud. Used by all accounts that do not configure an own interval.

# thing types

thing-type.xsense.account.label = X-Sense Account
thing-type.xsense.account.description = Connects to the X-Sense cloud account and provides access to the registered base stations and sensors.

# thing types config

thing-type.config.xsense.account.email.label = Email Address
thing-type.config.xsense.account.email.description = Email address of the X-Sense account.
thing-type.config.xsense.account.password.label = Password
thing-type.config.xsense.account.password.description = Password of the X-Sense account.
thing-type.config.xsense.account.refreshInterval.label = Refresh Interval
thing-type.config.xsense.account.refreshInterval.description = Interval in seconds for polling the device inventory from the X-Sense cloud. If not set, the default from the binding configuration applies.

# dynamic labels

account.label = X-Sense Account ({0})

# thing status descriptions

offline.communication-error = Communication with the X-Sense cloud failed: {0}
offline.communication-error-session = The cloud session expired and could not be renewed: {0}
offline.config-error-credentials = Email address and password must be configured
offline.config-error-login = Login to the X-Sense cloud failed, check email address and password: {0}
