# channel types

channel-type.xsense.co-alarm.label = CO Alarm
channel-type.xsense.co-alarm.description = Indicates whether the detector reports a carbon monoxide alarm.
channel-type.xsense.co-ppm.label = CO Concentration
channel-type.xsense.co-ppm.description = Measured carbon monoxide concentration.
channel-type.xsense.heat-alarm.label = Heat Alarm
channel-type.xsense.heat-alarm.description = Indicates whether the detector reports a heat alarm.
channel-type.xsense.humidity.label = Humidity
channel-type.xsense.humidity.description = Measured relative humidity.
channel-type.xsense.path.label = Hierarchy Path
channel-type.xsense.path.description = JSON describing where this thing belongs in the account/home/station/device hierarchy, e.g. {"account":"a@b.c","home":{"id":"h1","name":"Home"},"station":{"sn":"SN1","name":"Hall"}}.
channel-type.xsense.signal.label = Signal Strength
channel-type.xsense.signal.description = RF signal strength between sensor and base station (0-3).
channel-type.xsense.smoke-alarm.label = Smoke Alarm
channel-type.xsense.smoke-alarm.description = Indicates whether the detector reports a smoke alarm.
channel-type.xsense.temperature.label = Temperature
channel-type.xsense.temperature.description = Measured temperature.
channel-type.xsense.water-alarm.label = Water Leak Alarm
channel-type.xsense.water-alarm.description = Indicates whether the detector reports a water leak.

